name: Link check

# Not a required check: external sites flake. Weekly, plus on doc changes.
on:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths: ["**/*.md", "**/*.yaml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 2 --exclude 'github\.com/jackrayner/hass-blueprints/blob/main/.*' '**/*.md' '**/*.yaml'
          fail: true
