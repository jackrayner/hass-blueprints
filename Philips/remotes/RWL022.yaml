blueprint:
  source_url: https://github.com/jackrayner/hass-blueprints/blob/main/Philips/remotes/RWL022.yaml
  name: ZHA - Philips Hue Dimmer (RWL022)
  description: 'Control lights with a Philips Hue Dimmer Switch.

    - Pressing the top button once briefly turns on the lights to their last status and colour temperature.

    - Pressing the bottom hue/off button once briefly will turn the lights off.

    - Long-pressing or double-clicking either the on or off button can each be set to apply brightness and colour temperature, activate a scene, or do nothing.

    - Clicking or holding either of middle dimmer buttons will adjust the brightness up and down accordingly.

    - "Always Sync" mode with configurable colour temperature and brightness to always set the lights to defined values when powered on.

    **Note:** the button referred to as "off" has "hue" written on it.
    '
  domain: automation
  input:
    remote:
      name: Philips Hue Dimmer Switch
      description: Pick a RWL022 Dimmer Switch
      selector:
        device:
          integration: zha
          model: RWL022
          entity:
            domain: sensor
            device_class: battery
          multiple: false
    light:
      name: Light(s)
      description: The light(s) to control
      selector:
        target:
          entity:
            domain: light
    on_hold_section:
      name: On button long-press
      icon: mdi:gesture-tap-button
      collapsed: true
      description: 'Long-press the on button'
      input:
        on_hold_action:
          name: On button long-press - action
          description: 'What to do: set brightness/colour temperature on the light(s), activate a scene, or nothing.'
          default: light
          selector:
            select:
              mode: dropdown
              options:
                - label: Set brightness and colour temperature
                  value: light
                - label: Activate scene
                  value: scene
                - label: Do nothing
                  value: none
        on_hold_colour_temp:
          name: On button long-press - colour temperature
          description: 'Used when the action is "Set brightness and colour temperature"'
          default: 3333
          selector:
            color_temp:
              unit: kelvin
              min: 2000
              max: 6535
        on_hold_brightness:
          name: On button long-press - brightness
          description: 'Used when the action is "Set brightness and colour temperature"'
          default: 100
          selector:
            number:
              min: 0.0
              max: 100.0
              mode: slider
              step: 1.0
              unit_of_measurement: '%'
        on_hold_scene:
          name: On button long-press - scene
          description: 'Used when the action is "Activate scene"'
          default: none
          selector:
            entity:
              domain: scene
              multiple: false
    off_hold_section:
      name: Off button long-press
      icon: mdi:gesture-tap-button
      collapsed: true
      description: 'Long-press the off (hue) button'
      input:
        off_hold_action:
          name: Off button long-press - action
          description: 'What to do: set brightness/colour temperature on the light(s), activate a scene, or nothing.'
          default: light
          selector:
            select:
              mode: dropdown
              options:
                - label: Set brightness and colour temperature
                  value: light
                - label: Activate scene
                  value: scene
                - label: Do nothing
                  value: none
        off_hold_colour_temp:
          name: Off button long-press - colour temperature
          description: 'Used when the action is "Set brightness and colour temperature"'
          default: 2200
          selector:
            color_temp:
              unit: kelvin
              min: 2000
              max: 6535
        off_hold_brightness:
          name: Off button long-press - brightness
          description: 'Used when the action is "Set brightness and colour temperature"'
          default: 25
          selector:
            number:
              min: 0.0
              max: 100.0
              mode: slider
              step: 1.0
              unit_of_measurement: '%'
        off_hold_scene:
          name: Off button long-press - scene
          description: 'Used when the action is "Activate scene"'
          default: none
          selector:
            entity:
              domain: scene
              multiple: false
    on_double_section:
      name: On button double-click
      icon: mdi:gesture-tap-button
      collapsed: true
      description: 'Double-click the on button'
      input:
        on_double_action:
          name: On button double-click - action
          description: 'What to do: set brightness/colour temperature on the light(s), activate a scene, or nothing.'
          default: light
          selector:
            select:
              mode: dropdown
              options:
                - label: Set brightness and colour temperature
                  value: light
                - label: Activate scene
                  value: scene
                - label: Do nothing
                  value: none
        on_double_colour_temp:
          name: On button double-click - colour temperature
          description: 'Used when the action is "Set brightness and colour temperature"'
          default: 3333
          selector:
            color_temp:
              unit: kelvin
              min: 2000
              max: 6535
        on_double_brightness:
          name: On button double-click - brightness
          description: 'Used when the action is "Set brightness and colour temperature"'
          default: 100
          selector:
            number:
              min: 0.0
              max: 100.0
              mode: slider
              step: 1.0
              unit_of_measurement: '%'
        on_double_scene:
          name: On button double-click - scene
          description: 'Used when the action is "Activate scene"'
          default: none
          selector:
            entity:
              domain: scene
              multiple: false
    off_double_section:
      name: Off button double-click
      icon: mdi:gesture-tap-button
      collapsed: true
      description: 'Double-click the off (hue) button'
      input:
        off_double_action:
          name: Off button double-click - action
          description: 'What to do: set brightness/colour temperature on the light(s), activate a scene, or nothing.'
          default: light
          selector:
            select:
              mode: dropdown
              options:
                - label: Set brightness and colour temperature
                  value: light
                - label: Activate scene
                  value: scene
                - label: Do nothing
                  value: none
        off_double_colour_temp:
          name: Off button double-click - colour temperature
          description: 'Used when the action is "Set brightness and colour temperature"'
          default: 2200
          selector:
            color_temp:
              unit: kelvin
              min: 2000
              max: 6535
        off_double_brightness:
          name: Off button double-click - brightness
          description: 'Used when the action is "Set brightness and colour temperature"'
          default: 25
          selector:
            number:
              min: 0.0
              max: 100.0
              mode: slider
              step: 1.0
              unit_of_measurement: '%'
        off_double_scene:
          name: Off button double-click - scene
          description: 'Used when the action is "Activate scene"'
          default: none
          selector:
            entity:
              domain: scene
              multiple: false
    sync:
      name: Always Sync
      description: 'Always set light colour and brightness to a set of defaults on power on'
      default: false
      selector:
        boolean:
    default_colour_temp:
      name: Always Sync - colour temperature
      description: 'Colour temperature to set lights to when long-pressing the on button'
      default: 3333
      selector:
        color_temp:
          unit: kelvin
          min: 2000
          max: 6535
    default_brightness:
      name: Always Sync - brightness
      description: 'Brightness percentage to set lights to when long-pressing the on button'
      default: 80
      selector:
        number:
          min: 0.0
          max: 100.0
          mode: slider
          step: 1.0
          unit_of_measurement: '%'
    night_mode:
      name: Night Mode
      description: 'Map the on button to a specific scene at night'
      default: false
      selector:
        boolean:
    night_mode_start:
      name: Night Mode - start time
      description: 'Start time for Night Mode'
      default: '23:00:00'
      selector:
        time:
    night_mode_end:
      name: Night Mode - end time
      description: 'End time for Night Mode'
      default: '07:00:00'
      selector:
        time:
    night_mode_scene:
      name: Night Mode - scene
      description: 'Scene for use with Night Mode'
      selector:
        entity:
          domain: scene
          multiple: false
mode: restart
max_exceeded: silent
variables:
  sync: !input "sync"
  night_mode: !input "night_mode"
  on_hold_action: !input "on_hold_action"
  off_hold_action: !input "off_hold_action"
  on_double_action: !input "on_double_action"
  off_double_action: !input "off_double_action"
  on_hold_scene: !input "on_hold_scene"
  off_hold_scene: !input "off_hold_scene"
  on_double_scene: !input "on_double_scene"
  off_double_scene: !input "off_double_scene"
trigger:
- platform: event
  event_type: zha_event
  event_data:
    device_id: !input 'remote'
    cluster_id: 64512
action:
- variables:
    command: '{{ trigger.event.data.command }}'
- choose:
  - conditions: '{{ command == ''on_short_release'' }}'
    sequence:
      - choose:
        - conditions:
          - '{{ night_mode }}'
          - condition: time
            after: !input 'night_mode_start'
            before: !input 'night_mode_end'
          sequence:
            service: scene.turn_on
            target:
              entity_id: !input 'night_mode_scene'
        - conditions: '{{ sync }}'
          sequence:
            service: light.turn_on
            target: !input 'light'
            data:
              brightness_pct: !input 'default_brightness'
              color_temp_kelvin: !input 'default_colour_temp'
        default:
          - service: light.turn_on
            target: !input 'light'
  - conditions: '{{ command == ''on_double_press'' }}'
    sequence:
      - choose:
        - conditions: '{{ on_double_action == ''light'' }}'
          sequence:
            - service: light.turn_on
              target: !input 'light'
              data:
                brightness_pct: !input 'on_double_brightness'
                color_temp_kelvin: !input 'on_double_colour_temp'
        - conditions:
          - '{{ on_double_action == ''scene'' }}'
          - '{{ on_double_scene not in [none, "", "none"] }}'
          sequence:
            - service: scene.turn_on
              target:
                entity_id: '{{ on_double_scene }}'
  - conditions: '{{ command == ''on_hold'' }}'
    sequence:
      - choose:
        - conditions: '{{ on_hold_action == ''light'' }}'
          sequence:
            - service: light.turn_on
              target: !input 'light'
              data:
                brightness_pct: !input 'on_hold_brightness'
                color_temp_kelvin: !input 'on_hold_colour_temp'
        - conditions:
          - '{{ on_hold_action == ''scene'' }}'
          - '{{ on_hold_scene not in [none, "", "none"] }}'
          sequence:
            - service: scene.turn_on
              target:
                entity_id: '{{ on_hold_scene }}'
  - conditions: '{{ command == ''off_short_release'' }}'
    sequence:
      service: light.turn_off
      target: !input 'light'
  - conditions: '{{ command == ''off_double_press'' }}'
    sequence:
      - choose:
        - conditions: '{{ off_double_action == ''light'' }}'
          sequence:
            - service: light.turn_on
              target: !input 'light'
              data:
                brightness_pct: !input 'off_double_brightness'
                color_temp_kelvin: !input 'off_double_colour_temp'
        - conditions:
          - '{{ off_double_action == ''scene'' }}'
          - '{{ off_double_scene not in [none, "", "none"] }}'
          sequence:
            - service: scene.turn_on
              target:
                entity_id: '{{ off_double_scene }}'
  - conditions: '{{ command == ''off_hold'' }}'
    sequence:
      - choose:
        - conditions: '{{ off_hold_action == ''light'' }}'
          sequence:
            - service: light.turn_on
              target: !input 'light'
              data:
                brightness_pct: !input 'off_hold_brightness'
                color_temp_kelvin: !input 'off_hold_colour_temp'
        - conditions:
          - '{{ off_hold_action == ''scene'' }}'
          - '{{ off_hold_scene not in [none, "", "none"] }}'
          sequence:
            - service: scene.turn_on
              target:
                entity_id: '{{ off_hold_scene }}'
  - conditions:
    - condition: or
      conditions:
      - '{{ command == ''up_press'' }}'
      - '{{ command == ''up_hold'' }}'
    sequence:
      service: light.turn_on
      target: !input 'light'
      data:
        brightness_step: 25
  - conditions:
    - condition: or
      conditions:
      - '{{ command == ''down_press'' }}'
      - '{{ command == ''down_hold'' }}'
    sequence:
      service: light.turn_on
      target: !input 'light'
      data:
        brightness_step: -25
