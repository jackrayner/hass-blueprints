blueprint:
  source_url: https://github.com/jackrayner/hass-blueprints/blob/main/Philips/remotes/RWL022.yaml
  name: ZHA - Philips Hue Dimmer (RWL022)
  description: 'Control lights with a Philips Hue Dimmer Switch.

    - Pressing the top button once briefly turns on the lights to their last status and colour temperature.

    - Pressing the bottom hue/off button once briefly will turn the lights off.

    - Long-pressing the on button will set the brightness and colour temperature of all lights to the specified values for "On button long-press brightness/colour temperature".

    - Long-pressing the off button will set the brightness and colour temperature of all lights to the specified values for "Off button long-press brightness/colour temperature".

    - Clicking or holding either of middle dimmer buttons will adjust the brightness up and down accordingly.

    - Double click either the on or off button to activate a specified scene.

    - "Always Sync" mode with configurable colour temperature and brightness to always set the lights to defined values when powered on.

    **Note:** the button referred to as "off" has "hue" written on it.
    '
  domain: automation
  input:
    remote:
      name: Philips Hue Dimmer Switch
      description: Pick a RWL022 Dimmer Switch
      selector:
        device:
          integration: zha
          model: RWL022
          entity:
            domain: sensor
            device_class: battery
          multiple: false
    light:
      name: Light(s)
      description: The light(s) to control
      selector:
        target:
          entity:
            domain: light
    on_colour_temp:
      name: On button long-press colour temperature
      description: 'Colour temperature to set lights to when long-pressing the on button'
      default: 300
      selector:
        color_temp:
    on_brightness:
      name: On button long-press brightness
      description: 'Brightness percentage to set lights to when long-pressing the on button'
      default: 100
      selector:
        number:
          min: 0.0
          max: 100.0
          mode: slider
          step: 1.0
          unit_of_measurement: '%'
    off_colour_temp:
      name: Off button long-press colour temperature
      description: 'Colour temperature to set lights to when long-pressing the off button'
      default: 454
      selector:
        color_temp:
    off_brightness:
      name: Off button long-press brightness
      description: 'Brightness percentage to set lights to when long-pressing the off button'
      default: 25
      selector:
        number:
          min: 0.0
          max: 100.0
          mode: slider
          step: 1.0
          unit_of_measurement: '%'
    on_double_click_colour_temp:
      name: On button double-click colour temperature
      description: 'Colour temperature to set lights to when double-clicking the on button'
      default: 300
      selector:
        color_temp:
    on_double_click_brightness:
      name: On button double-click brightness
      description: 'Brightness percentage to set lights to when double-clicking the on button'
      default: 100
      selector:
        number:
          min: 0.0
          max: 100.0
          mode: slider
          step: 1.0
          unit_of_measurement: '%'
    off_double_click_colour_temp:
      name: Off button double-click colour temperature
      description: 'Colour temperature to set lights to when double-clicking the off (hue) button'
      default: 454
      selector:
        color_temp:
    off_double_click_brightness:
      name: Off button double-click brightness
      description: 'Brightness percentage to set lights to when double-clicking the off (hue) button'
      default: 25
      selector:
        number:
          min: 0.0
          max: 100.0
          mode: slider
          step: 1.0
          unit_of_measurement: '%'
    sync:
      name: Always Sync
      description: 'Always set light colour and brightness to a set of defaults on power on'
      default: false
      selector:
        boolean:
    default_colour_temp:
      name: Always Sync - colour temperature
      description: 'Colour temperature to set lights to when long-pressing the on button'
      default: 300
      selector:
        color_temp:
    default_brightness:
      name: Always Sync - brightness
      description: 'Brightness percentage to set lights to when long-pressing the on button'
      default: 80
      selector:
        number:
          min: 0.0
          max: 100.0
          mode: slider
          step: 1.0
          unit_of_measurement: '%'
    night_mode:
      name: Night Mode
      description: 'Map the on button to a specific scene at night'
      default: false
      selector:
        boolean:
    night_mode_start:
      name: Night Mode - start time
      description: 'Start time for Night Mode'
      default: '23:00:00'
      selector:
        time:
    night_mode_end:
      name: Night Mode - end time
      description: 'End time for Night Mode'
      default: '07:00:00'
      selector:
        time:
    night_mode_colour_temp:
      name: Night Mode - colour temperature
      description: 'Colour temperature to use with Night Mode'
      default: 300
      selector:
        color_temp:
    night_mode_brightness:
      name: Night Mode - brightness
      description: 'Brightness percentage to use with Night Mode'
      default: 100
      selector:
        number:
          min: 0.0
          max: 100.0
          mode: slider
          step: 1.0
          unit_of_measurement: '%'
mode: restart
max_exceeded: silent
variables:
  sync: !input "sync"
trigger:
- platform: event
  event_type: zha_event
  event_data:
    device_id: !input 'remote'
    cluster_id: 64512
action:
- variables:
    command: '{{ trigger.event.data.command }}'
- choose:
  - conditions: '{{ command == ''on_short_release'' }}'
    sequence:
      - choose:
        - conditions:
            condition: time
            after: !input 'night_mode_start'
            before: !input 'night_mode_end'
          sequence:
            service: light.turn_on
            target: !input 'light'
            data:
              brightness_pct: !input 'night_mode_brightness'
              color_temp_kelvin: !input 'night_mode_colour_temp'
        - conditions: '{{ sync }}'
          sequence:
            service: light.turn_on
            target: !input 'light'
            data:
              brightness_pct: !input 'default_brightness'
              color_temp_kelvin: !input 'default_colour_temp'
        default:
          - service: light.turn_on
            target: !input 'light'
  - conditions: '{{ command == ''on_double_press'' }}'
    sequence:
      service: light.turn_on
      target: !input 'light'
      data:
        brightness_pct: !input 'on_double_click_brightness'
        color_temp_kelvin: !input 'on_double_click_colour_temp'
  - conditions: '{{ command == ''on_hold'' }}'
    sequence:
      service: light.turn_on
      target: !input 'light'
      data:
        brightness_pct: !input 'on_brightness'
        color_temp_kelvin: !input 'on_colour_temp'
  - conditions: '{{ command == ''off_short_release'' }}'
    sequence:
      service: light.turn_off
      target: !input 'light'
  - conditions: '{{ command == ''off_double_press'' }}'
    sequence:
      service: light.turn_on
      target: !input 'light'
      data:
        brightness_pct: !input 'off_double_click_brightness'
        color_temp_kelvin: !input 'off_double_click_colour_temp'
  - conditions: '{{ command == ''off_hold'' }}'
    sequence:
      service: light.turn_on
      target: !input 'light'
      data:
        brightness_pct: !input 'off_brightness'
        color_temp_kelvin: !input 'off_colour_temp'
  - conditions:
    - condition: or
      conditions:
      - '{{ command == ''up_press'' }}'
      - '{{ command == ''up_hold'' }}'
    sequence:
      service: light.turn_on
      target: !input 'light'
      data:
        brightness_step: 25
  - conditions:
    - condition: or
      conditions:
      - '{{ command == ''down_press'' }}'
      - '{{ command == ''down_hold'' }}'
    sequence:
      service: light.turn_on
      target: !input 'light'
      data:
        brightness_step: -25
